services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    volumes: [qdrant_data:/qdrant/storage]
    networks: [private]

  ollama:
    image: ollama/ollama:0.12.3
    environment:
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-1}
      OLLAMA_MAX_QUEUE: ${OLLAMA_MAX_QUEUE:-2}
    restart: unless-stopped
    volumes: [ollama_data:/root/.ollama]
    networks: [private]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      LEXICAL_INDEX_PATH: /state/lexical
      DOCUMENT_STATE_PATH: /state/document-manager
      STATE_PATH: /state
      INDEX_LOCK_PATH: /state/locks
    volumes:
      - type: bind
        source: ./documents
        target: /documents
        bind:
          create_host_path: false
      - app_state:/state
      - document_state:/state/document-manager
    depends_on: [qdrant, ollama]
    networks: [private]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    depends_on: [backend]
    networks: [private, entry]

volumes:
  qdrant_data:
  ollama_data:
  app_state:
  document_state:

networks:
  private:
    internal: true
  entry:
