services:
  qdrant:
    image: qdrant/qdrant:v1.15.4
    restart: unless-stopped
    ports: ["127.0.0.1:6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  ollama:
    image: ollama/ollama:0.12.3
    restart: unless-stopped
    ports: ["127.0.0.1:11434:11434"]
    volumes: [ollama_data:/root/.ollama]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      INDEX_LOCK_PATH: /state/locks
      DOCUMENT_STATE_PATH: /state/documents
      DOCUMENTS_PATH: /documents
      LEXICAL_INDEX_PATH: /state/lexical
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - type: bind
        source: ./documents
        target: /documents
        read_only: false
        bind:
          create_host_path: false
      - index_locks:/state/locks
      - document_state:/state/documents
      - lexical_data:/state/lexical
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt: [no-new-privileges:true]
    depends_on: [qdrant, ollama]

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports: ["127.0.0.1:3000:80"]
    depends_on: [backend]

volumes:
  qdrant_data:
  ollama_data:
  index_locks:
  document_state:
  lexical_data:
