version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    # Revisit this bound only when the selected Qdrant client supports Portalocker 4.
    ignore:
      - dependency-name: portalocker
        versions: [">=4.0"]
    groups:
      qdrant-storage:
        patterns: ["qdrant-client", "portalocker"]
        update-types: ["minor", "patch"]
      python-dependencies:
        patterns: ["*"]
        exclude-patterns: ["qdrant-client", "portalocker"]
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      frontend-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /frontend
    schedule:
      interval: monthly

