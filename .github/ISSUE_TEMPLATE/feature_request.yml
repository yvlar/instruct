name: Proposer une amélioration
description: Proposer une fonctionnalité ou une évolution
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problème à résoudre
      description: Décrivez le besoin plutôt que seulement la solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Solution proposée
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Effets sur la sécurité et la confidentialité
      description: Indiquez les effets sur les documents, les citations et les réponses.
    validations:
      required: true

