name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Installer les dépendances
        run: pip install -r backend/requirements-dev.txt
      - name: Tester le backend
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci
      - name: Compiler le frontend
        working-directory: frontend
        run: npm run build
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Installer les doubles de services et le navigateur
        run: |
          pip install -r backend/requirements-dev.txt
          cd frontend
          npx playwright install --with-deps chromium
      - name: Vérifier le parcours documentaire sur ordinateur et mobile
        working-directory: frontend
        run: npm run test:e2e
      - name: Conserver les captures et traces navigateur
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: documents-browser
          path: |
            docs/screenshots/*.png
            frontend/test-results/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Créer la configuration
        run: cp .env.example .env
      - name: Valider Docker Compose
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml -f docker-compose.gpu.yml config --quiet
      - name: Construire les images applicatives
        run: docker compose build backend frontend
